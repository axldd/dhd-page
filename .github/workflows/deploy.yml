name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TEMPORARY: builds the site to work under https://axldd.github.io/dhd-page/
      # so club members can see it before the domain is switched over. The
      # preview is noindex + robots Disallow so it can't compete with the real
      # site in search results.
      #
      # AT CUTOVER: delete this `env:` block. That is the only change needed —
      # the site then builds for the domain root again, indexable, as before.
      - name: Build site
        run: npm run build
        env:
          PREVIEW_BASE: /dhd-page

      - name: Check that every legacy URL still resolves
        run: npm run check:urls
        env:
          PREVIEW_BASE: /dhd-page

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

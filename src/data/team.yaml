# The people behind Downhill Deutschland, shown on /uber-downhill-deutschland/.
#
# Names, e-mail addresses and bios are copied verbatim from the old WordPress
# "Organisation" page. Do not reword them — ask the person instead.
# `photo` is a path relative to src/assets/.

- name: Ulrich Becker
  email: ulrich@downhilldeutschland.de
  photo: uploads/2024/05/271389999_10220663805967912_7512088791727003896_n.jpeg
  bio: >-
    Streetluger aus Offenbach, geboren 1966 ist seit 2014 im Downhill-Sport aktiv.
    Seit 2017 fährt er auf der Streetluge viele nationale und internationale Rennen
    mit. Er genießt aber auch die entspannte Seite des Sports und liebt es, einfach
    mal einen Alpenpass runter zu schallern.

- name: Brini
  email: brini@downhilldeutschland.de
  photo: uploads/2024/06/brini-edited.jpeg

- name: Chris
  email: chris@downhilldeutschland.de
  photo: uploads/2024/06/chris-edited.jpeg
  bio: >-
    Aktiver Downhillskater aus Ravensburg, geboren 1989. Hat gelernt zu skaten,
    nachdem er laufen konnte. Ab 2013 Teilnahme an deutschen und internationalen
    Rennen, mittlerweile zweifacher Deutscher Meister (2022 & 2023). Ohne Skaten
    wird er grantig.

- name: Gago
  email: gago@downhilldeutschland.de
  photo: uploads/2024/06/gago.jpeg
  bio: >-
    Downhill Skater aus Stuttgart. Geboren 1983, skatet seit 2005. Nimmt seit über
    10 Jahren an Skateboard Races Weltweit teil und skatet fast jede freie Minute.
    IDF Master Class Euro Champ 2019 und WDSC Master Class World Champion 2022. Ist
    Schreinermeister und immer für einen Wortwitz zu haben.

- name: Alex
  email: alex@downhilldeutschland.de
  photo: uploads/2024/06/VSHN-portrait-edited-scaled.jpg
  bio: >-
    Im Jahr 2008 war Alex zum ersten mal auf einem Downhill Event. Seitdem nutzt er
    so viel seiner Freizeit wie möglich für den Sport. Vor ein paar Jahren zog er
    von Mainz in die Schweiz um näher an den guten Strecken zu sein.
    Um seine Sucht zu finanzieren arbeitet er irgendwas mit Computern.
